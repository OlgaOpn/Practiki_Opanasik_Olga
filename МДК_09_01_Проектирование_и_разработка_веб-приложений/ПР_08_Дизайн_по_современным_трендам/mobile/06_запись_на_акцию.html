<main class="page">

<form method="post" class="panel panel--narrow" novalidate="" data-validate="">
  <h1>Запись на акцию</h1>
  <p class="muted">Координатор подтвердит заявку и напишет вам на почту.</p>
  <input type="hidden" name="csrf_token" value="">
  <div class="field">
    <label for="action_id">Акция</label>
    <select id="action_id" name="action_id">
      <option value="">Выберите акцию</option>
      <option value="3">21 ноября 2026 — Посадка деревьев на ВДНХ</option><option value="4" selected="">28 ноября 2026 — Мастерская для детей из центра «Солнце»</option><option value="5">12 декабря 2026 — Новогодние открытки для дома престарелых</option><option value="6">9 января 2027 — Помощь на благотворительном забеге «5 км добра»</option>
    </select>
    <span class="field__err" role="alert"></span>
  </div>
  <fieldset class="field">
    <legend>Чем хотите помочь</legend>
    <div class="tiles">
      <label class="tile"><input type="radio" name="task" value="Работа на площадке"><span>Работа на площадке</span></label><label class="tile"><input type="radio" name="task" value="Встреча и регистрация участников"><span>Встреча и регистрация участников</span></label><label class="tile"><input type="radio" name="task" value="Фото и соцсети"><span>Фото и соцсети</span></label><label class="tile"><input type="radio" name="task" value="Логистика и доставка"><span>Логистика и доставка</span></label>
    </div>
    <span class="field__err" role="alert"></span>
  </fieldset>
  <div class="field">
    <label for="comment">Комментарий <span class="muted">(необязательно)</span></label>
    <textarea id="comment" name="comment" maxlength="400" placeholder="Например: есть машина, могу привезти инструменты"></textarea>
    <span class="field__err" role="alert"></span>
  </div>
  <div class="form-foot"><button class="btn" type="submit">Отправить заявку</button><a class="muted" href="05_личный_кабинет.html">Отмена</a></div>
</form>

  </div>
</main>
