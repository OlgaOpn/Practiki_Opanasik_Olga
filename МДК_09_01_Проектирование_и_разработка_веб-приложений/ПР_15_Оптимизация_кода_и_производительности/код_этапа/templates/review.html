{% extends "base.html" %}
{% block title %}Отзыв — Добрый город{% endblock %}
{% block content %}
<form method="post" class="panel panel--narrow" novalidate data-validate>
  <h1>Как прошла акция?</h1>
  <p class="muted">{{ s.title }} · {{ s.action_date|full_date }}</p>
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <fieldset class="field{% if errors.rating %} field--error{% endif %}">
    <legend>Оценка</legend>
    <div class="rating">
      {% for n in range(5, 0, -1) %}<input type="radio" id="r{{ n }}" name="rating" value="{{ n }}" {% if data.rating == n|string %}checked{% endif %}><label for="r{{ n }}" title="{{ n }} из 5">★</label>{% endfor %}
    </div>
    <span class="field__err" role="alert">{{ errors.get('rating', '') }}</span>
  </fieldset>
  <div class="field{% if errors.body %} field--error{% endif %}">
    <label for="body">Ваш отзыв</label>
    <textarea id="body" name="body" maxlength="1000" placeholder="Что понравилось, что можно улучшить?">{{ data.get('body', '') }}</textarea>
    <span class="field__err" role="alert">{{ errors.get('body', '') }}</span>
  </div>
  <div class="form-foot"><button class="btn" type="submit">Опубликовать отзыв</button><a class="muted" href="/cabinet">Отмена</a></div>
</form>
{% endblock %}
