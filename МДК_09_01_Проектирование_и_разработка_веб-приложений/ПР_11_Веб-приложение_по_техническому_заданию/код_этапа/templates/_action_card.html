<article class="card">
  <div class="card__band cat-{{ cat_class(a.category) }}">
    <span class="card__cat">{% include "icons/cat-" ~ cat_class(a.category) ~ ".svg" %}{{ a.category }}</span>
    <span class="date"><b>{{ a.action_date|day }}</b><span>{{ a.action_date|mon }}</span></span>
  </div>
  <div class="card__body">
    <h3><a href="/actions/{{ a.id }}">{{ a.title }}</a></h3>
    <p class="place">{% include "icons/pin.svg" %}{{ a.place }}</p>
    <p class="card__text">{{ a.description|truncate(120) }}</p>
    <div class="card__foot">
      <label class="meter">Записалось {{ taken }} из {{ a.needed }}<progress max="{{ a.needed }}" value="{{ taken }}"></progress></label>
      {% if taken >= a.needed %}
        <span class="btn btn--ghost btn--block" aria-disabled="true">Набор закрыт</span>
      {% else %}
        <a class="btn btn--block" href="/signup?action={{ a.id }}">Хочу помочь</a>
      {% endif %}
    </div>
  </div>
</article>
